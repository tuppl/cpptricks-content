name: Validate posts

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate.ts"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate.ts"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun scripts/validate.ts
